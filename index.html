<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>桌遊計分</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E3; --paper-deep:#EFE7D2; --ink:#26221B; --ink-soft:#6B6353;
  --line:#D8CFB4; --pen:#2456C7; --accent:#3E7C4F; --accent-soft:#3E7C4F22;
  --radius:10px; --white:#FFFDF7;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--paper); color:var(--ink); font-size:16px;
  overscroll-behavior:none;
}
.score-hand{font-family:'Caveat',cursive; color:var(--pen); font-weight:700;}

/* ===== App frame ===== */
#app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}
header.bar{
  position:sticky; top:0; z-index:20; background:var(--accent); color:#fff;
  padding:14px 16px; display:flex; align-items:center; gap:10px;
  box-shadow:0 2px 0 rgba(0,0,0,.12);
  transition:background .25s;
}
header.bar h1{font-size:18px; font-weight:700; flex:1; text-align:center; letter-spacing:.05em;}
header.bar button{
  background:none; border:none; color:#fff; font-size:15px; font-weight:600;
  padding:4px 6px; cursor:pointer; min-width:52px;
}
header.bar button:focus-visible{outline:2px solid #fff; outline-offset:2px;}
main{flex:1; padding:16px; padding-bottom:96px;}

/* ===== Tabs ===== */
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:20;
  background:var(--white); border-top:1.5px solid var(--line);
  display:flex; max-width:560px; margin:0 auto;
}
nav.tabs button{
  flex:1; padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  background:none; border:none; font-size:14px; color:var(--ink-soft); cursor:pointer;
  font-weight:600;
}
nav.tabs button.active{color:var(--accent);}
nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}

/* ===== Game list ===== */
.search{
  width:100%; padding:12px 14px; font-size:16px; border:1.5px solid var(--line);
  border-radius:var(--radius); background:var(--white); margin-bottom:14px; color:var(--ink);
}
.search:focus{outline:2px solid var(--accent);}
.gcard{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--white); border:1.5px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:10px; cursor:pointer; font-size:16px;
}
.gcard:active{transform:scale(.985);}
.gcard .dot{width:14px; height:14px; border-radius:50%; flex-shrink:0;}
.gcard .gname{font-weight:700; flex:1;}
.gcard .gname small{display:block; font-weight:400; color:var(--ink-soft); font-size:12.5px; margin-top:2px;}
.chip{
  font-size:12px; background:var(--paper-deep); color:var(--ink-soft);
  padding:3px 8px; border-radius:99px; white-space:nowrap;
}
.gcard .rank{
  font-size:12px; font-weight:700; color:var(--ink-soft); flex-shrink:0;
  min-width:24px; text-align:right; font-variant-numeric:tabular-nums;
}
.genericnote{
  display:block; font-weight:600; font-size:11.5px; color:#8A6D1F; margin-top:3px;
}
.offline-note{
  font-size:12.5px; line-height:1.5; color:#8A6D1F;
  background:#E5B23A22; border:1px solid #E5B23A55; border-radius:8px;
  padding:8px 11px; margin-bottom:12px;
}

/* ===== Setup ===== */
.slabel{font-size:13px; font-weight:700; color:var(--ink-soft); letter-spacing:.08em; margin:18px 0 8px;}
.pchips{display:flex; flex-wrap:wrap; gap:8px;}
.pchip{
  display:flex; align-items:center; gap:6px; background:var(--white);
  border:1.5px solid var(--line); border-radius:99px; padding:8px 12px; font-size:15px;
}
.pchip b{font-weight:600;}
.pchip .x{border:none; background:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:0 2px;}
.addrow{display:flex; gap:8px; margin-top:10px;}
.addrow input{
  flex:1; padding:11px 14px; font-size:16px; border:1.5px solid var(--line);
  border-radius:var(--radius); background:var(--white); color:var(--ink);
}
.btn{
  border:none; border-radius:var(--radius); padding:12px 18px; font-size:16px;
  font-weight:700; cursor:pointer; background:var(--accent); color:#fff;
}
.btn.ghost{background:var(--paper-deep); color:var(--ink);}
.btn.big{width:100%; padding:15px; margin-top:22px; font-size:17px;}
.btn:disabled{opacity:.45; cursor:default;}
.btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

/* ===== Score sheet ===== */
.sheetwrap{
  background:var(--white); border:1.5px solid var(--line); border-radius:var(--radius);
  overflow-x:auto; box-shadow:0 1px 0 rgba(0,0,0,.05);
}
table.sheet{border-collapse:collapse; width:100%; min-width:100%;}
table.sheet th, table.sheet td{border:1px solid var(--line); padding:0;}
table.sheet thead th{
  background:var(--paper-deep); font-size:14.5px; font-weight:700; padding:10px 6px;
  min-width:76px; position:sticky; top:0;
}
table.sheet thead th:first-child{min-width:132px; text-align:left; padding-left:12px;}
.frow-label{
  display:flex; align-items:center; gap:8px; padding:10px 8px 10px 12px; font-size:14px; font-weight:600;
  line-height:1.25;
}
.frow-label .fic{
  width:26px; height:26px; border-radius:7px; display:flex; align-items:center;
  justify-content:center; font-size:15px; flex-shrink:0;
}
.frow-label small{display:block; font-weight:400; font-size:11.5px; color:var(--ink-soft);}
td.cell{text-align:center; cursor:pointer; height:52px; position:relative;}
td.cell .val{font-size:26px; line-height:1;}
td.cell .val.empty{color:#C9C0A8; font-size:15px; font-family:inherit; font-weight:400;}
td.cell:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
td.cell .cnt{
  display:flex; align-items:center; justify-content:center; gap:2px; height:100%;
}
td.cell .cnt button{
  border:none; background:var(--paper-deep); color:var(--ink); width:26px; height:34px;
  border-radius:7px; font-size:17px; font-weight:700; cursor:pointer; flex-shrink:0;
}
td.cell .cnt .val{min-width:36px;}
tr.trow td{background:var(--paper-deep); font-weight:700;}
tr.trow td:first-child{padding:10px 12px; font-size:15px;}
tr.trow td .val{font-size:30px;}
.sheetnote{font-size:12.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5;}

/* ===== keypad sheet ===== */
#pad{
  position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:560px; margin:0 auto;
  background:var(--white); border-top:2px solid var(--line);
  border-radius:16px 16px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(105%); transition:transform .22s ease;
  box-shadow:0 -6px 24px rgba(0,0,0,.15);
}
#pad.open{transform:translateY(0);}
#pad .padhead{display:flex; align-items:center; margin-bottom:10px; gap:10px;}
#pad .padhead .who{font-weight:700; flex:1; font-size:15px;}
#pad .padval{font-size:38px; min-width:80px; text-align:right;}
#pad .keys{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
#pad .keys button{
  border:none; background:var(--paper-deep); border-radius:var(--radius);
  font-size:22px; font-weight:700; padding:14px 0; cursor:pointer; color:var(--ink);
}
#pad .keys button.act{background:var(--accent); color:#fff; font-size:17px;}
#pad .keys button:active{transform:scale(.96);}
@media (prefers-reduced-motion:reduce){ #pad{transition:none;} }

/* tiered picker */
.tierlist{display:flex; flex-direction:column; gap:8px; max-height:40vh; overflow-y:auto;}
.tierlist button{
  display:flex; justify-content:space-between; border:1.5px solid var(--line);
  background:var(--white); border-radius:var(--radius); padding:12px 14px;
  font-size:16px; cursor:pointer; color:var(--ink);
}
.tierlist button b{font-size:18px;}

/* ===== history ===== */
.pcard{
  background:var(--white); border:1.5px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:10px;
}
.pcard .top{display:flex; align-items:center; gap:8px;}
.pcard .top .dot{width:12px; height:12px; border-radius:50%;}
.pcard .top b{flex:1;}
.pcard .top time{font-size:12.5px; color:var(--ink-soft);}
.pcard .res{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;}
.pcard .res span{
  font-size:13.5px; background:var(--paper-deep); border-radius:99px; padding:4px 10px;
}
.pcard .res span.win{background:var(--accent-soft); font-weight:700;}
.pcard .rowbtns{margin-top:10px; display:flex; gap:8px;}
.pcard .rowbtns button{
  border:none; background:none; color:var(--ink-soft); font-size:13.5px;
  cursor:pointer; padding:4px 6px; font-weight:600;
}
.empty-state{
  text-align:center; color:var(--ink-soft); padding:48px 20px; line-height:1.7; font-size:15px;
}
.empty-state .big{font-size:40px; margin-bottom:8px;}
.iorow{display:flex; gap:10px; margin-top:16px;}
.iorow .btn{flex:1; font-size:14.5px; padding:11px;}
.toast{
  position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:99px;
  font-size:14px; opacity:0; transition:.25s; z-index:60; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ===== 信度提示條(一行細字,唔阻擋操作) ===== */
.srcbar{
  display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px;
  font-size:12px; line-height:1.5; color:var(--ink-soft); margin:-2px 0 10px;
}
.srcbar.ok{color:#2E7D4F;}
.srcbar.warn{color:#8A6D1F;}
.srcbar.custom{color:var(--pen);}
.srcbar a{color:inherit;}
.srcbar .lnk{
  background:none; border:none; padding:0; font:inherit; color:var(--ink-soft);
  text-decoration:underline; cursor:pointer;
}
.sheetacts{display:flex; gap:8px; margin-top:12px;}
.sheetacts .btn{flex:1; font-size:14px; padding:10px;}

/* ===== 計分表編輯器 ===== */
.ednote{
  font-size:12.5px; line-height:1.55; color:var(--ink-soft);
  background:var(--white); border:1.5px solid var(--line); border-radius:8px;
  padding:9px 11px; margin-bottom:14px;
}
.ederr-top{
  font-size:13px; line-height:1.6; color:#A3312B;
  background:#C6362E14; border:1px solid #C6362E55; border-radius:8px;
  padding:9px 11px; margin-bottom:14px;
}
.edlab{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
.edin{
  padding:9px 11px; font-size:15px; border:1.5px solid var(--line);
  border-radius:8px; background:var(--white); color:var(--ink); width:100%;
  font-family:inherit;
}
.edin:focus{outline:2px solid var(--accent); outline-offset:-1px;}
.edcard{
  background:var(--white); border:1.5px solid var(--line); border-radius:var(--radius);
  padding:11px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px;
}
.edcard.bad{border-color:#C6362E; background:#C6362E0A;}
.edhd{display:flex; gap:6px; align-items:center;}
.edhd .ico{width:52px; text-align:center; flex-shrink:0; font-size:17px; padding:9px 2px;}
.edhd .edin[data-k="label"]{flex:1; min-width:0; font-weight:600;}
.edbtn{
  border:1.5px solid var(--line); background:var(--paper-deep); color:var(--ink);
  width:30px; height:36px; border-radius:8px; font-size:14px; cursor:pointer; flex-shrink:0;
}
.edbtn:disabled{opacity:.3; cursor:default;}
.edbtn.del{color:#A3312B;}
.edrow{display:flex; gap:8px;}
.edrow .edin{flex:1; min-width:0;}
.edlab2{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft);}
.edlab2.col{flex-direction:column; align-items:stretch; gap:5px;}
.edlab2 .num{width:110px; flex-shrink:0;}
.edlab2 .ta{font-size:14px; line-height:1.6; resize:vertical; font-family:ui-monospace,Menlo,Consolas,monospace;}
.edchk{display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-soft);}
.edchk input{width:17px; height:17px;}
.edid{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-soft);}
.edid .idin{
  font-size:12px; padding:5px 8px; font-family:ui-monospace,Menlo,Consolas,monospace;
}
.ederr{font-size:12.5px; line-height:1.55; color:#A3312B; font-weight:600;}
.edcount{font-size:12px; color:var(--ink-soft); margin:-4px 0 8px;}

/* ===== 清單分批載入 ===== */
.listcount{font-size:12px; color:var(--ink-soft); text-align:center; padding:8px 0 2px;}
#gsentinel{height:1px;}

/* ===== boot 錯誤條(唔准白屏死俾人睇) ===== */
#bootError{
  display:none; position:fixed; top:0; left:0; right:0; z-index:9999;
  background:#B3261E; color:#fff; font-size:12.5px; line-height:1.55;
  padding:10px 38px 12px 14px; max-height:50vh; overflow-y:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  white-space:pre-wrap; word-break:break-word;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}
#bootError.show{display:block;}
#bootError b{display:block; font-size:13.5px; margin-bottom:5px; font-family:inherit;}
#bootError .x{
  position:absolute; top:5px; right:7px; background:none; border:none;
  color:#fff; font-size:18px; line-height:1; cursor:pointer; padding:3px 7px;
}
</style>
</head>
<body>
<div id="bootError" role="alert" aria-live="assertive"></div>

<!-- ⚠️ 呢段一定要係獨立、行喺主程式之前嘅 script block。
     同一個 block 內嘅語法錯誤 = 成 block 唔會執行,handler 擺喺
     入面就接唔到自己。分開咗,主程式 parse 唔到都會經
     window.onerror 報出「邊個檔第幾行」。
     刻意用 ES5 寫法(var / function),舊 WebView 都 parse 到。 -->
<script>
(function(){
  var box=null, count=0;
  function show(title, detail){
    count++;
    if(!box) box=document.getElementById("bootError");
    if(!box){ return; }
    if(count===1){
      box.innerHTML='<button class="x" type="button" aria-label="關閉">✕</button><b></b><span></span>';
      box.getElementsByClassName("x")[0].onclick=function(){ box.classList.remove("show"); };
    }
    box.getElementsByTagName("b")[0].textContent=
      "⚠️ "+title+(count>1?"（第 "+count+" 個錯誤）":"");
    var s=box.getElementsByTagName("span")[0];
    s.textContent=(s.textContent?s.textContent+"\n\n":"")+detail;
    box.classList.add("show");
  }
  function frame(err){
    if(!err || !err.stack) return "";
    return "\n"+String(err.stack).split("\n").slice(0,4).join("\n");
  }
  window.onerror=function(msg, src, line, col, err){
    show("開 app 出錯", String(msg)+"\n"
      +String(src||"(unknown)").split("/").pop()+" 第 "+line+" 行 第 "+col+" 欄"
      +frame(err));
    return false;                       // 唔阻止 console 照報
  };
  window.addEventListener("unhandledrejection", function(e){
    var r=e.reason;
    show("未處理嘅 Promise 錯誤",
      (r && r.message ? r.message : String(r))+frame(r));
  });
  /* 主程式 parse 唔到就完全唔會行 —— 呢個 flag 永遠唔會 set,
     load 之後見到冇 flag 即刻報出嚟,唔會淨係得個白屏。 */
  window.addEventListener("load", function(){
    setTimeout(function(){
      if(!window.__appScriptRan){
        show("主程式冇執行到",
          "index.html 嘅主 script block 由頭到尾冇行過。\n"
          +"通常係語法唔兼容(舊 WebView parse 唔到),\n"
          +"上面應該會有一行講明係第幾行出事。");
      }
    }, 0);
  });
  window.__showBootError=show;          // 主程式接到錯誤都用返呢個
})();
</script>

<div id="app">
  <header class="bar" id="bar">
    <button id="backBtn" style="visibility:hidden">‹ 返回</button>
    <h1 id="barTitle">桌遊計分</h1>
    <button id="editBtn" style="visibility:hidden; min-width:28px" title="修改計分表" aria-label="修改計分表">✏️</button>
    <button id="saveBtn" style="visibility:hidden">儲存</button>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="games" class="active">🎲 計分</button>
    <button data-tab="history">📜 紀錄</button>
  </nav>
</div>

<div id="pad" role="dialog" aria-label="輸入分數"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   桌遊計分 v1 — schema-driven score sheet
   schema: fields[] of input types: number | counter | tiered | bonus
   storage: IndexedDB with in-memory fallback (artifact 預覽環境冇持久儲存)
   遊戲數據: 100% 由 pipeline/out/ 載入,冇任何內置遊戲;載過嘅會入 IndexedDB "cache" store 供離線用
========================================================= */

/* ---------- 遊戲庫:外部數據載入層 ----------
   App 冇任何內置遊戲。數據 100% 嚟自 DATA_BASE 下面:
     {DATA_BASE}/games-index.json      = 清單(BGG meta + nameZh / accent)
     {DATA_BASE}/scoring/{gameId}.json = 揀咗遊戲先 lazy load
   兩者 fetch 成功都會寫入 IndexedDB 快取("cache" store),
   下次冇網就由快取讀返。冇計分表嘅遊戲開通用計分表。 */

/* 行到呢度 = 主程式 parse 得成功。上面嗰段 guard script 靠呢個 flag
   分辨「app 出錯」同「app 由頭到尾冇行過(語法唔兼容)」。 */
window.__appScriptRan = true;

/* 數據根目錄(單一數據源)。以後搬位淨係改呢一行。 */
const DATA_BASE = "pipeline/out";

const catalog = {
  list: [],              // 清單
  offline: false,        // index 由快取讀返 = 離線模式
  noData: false,         // 網同快取都冇 = 首次使用未下載過
  cache: new Map(),      // gameId → 完整 schema(今次 session load 過嘅)
  userIds: new Set()     // 有用戶自訂 template 嘅 gameId(boot 時由 IndexedDB 讀返)
};

const HEXRE = /^#[0-9A-Fa-f]{6}$/;

/* HSL → #RRGGBB(schema 規定 theme.accent 一定要 hex) */
function hslHex(h, s, l){
  const a = s * Math.min(l, 1 - l);
  const ch = n => {
    const k = (n + h / 30) % 12;
    const v = l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
    return Math.round(255 * v).toString(16).padStart(2, "0");
  };
  return "#" + ch(0) + ch(8) + ch(4);
}

/* index 冇 accent 先用(fallback):由 gameId 派生一個穩定嘅顏色做清單圓點 */
function derivedAccent(id){
  let h = 0;
  for(const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return hslHex(h % 360, 0.40, 0.45);
}

/* 淨低 hex 先當數,唔係就派生一個(用戶 template 一定要合 schema) */
function safeAccent(accent, gameId){
  return HEXRE.test(accent || "") ? accent : derivedAccent(gameId);
}

function indexEntry(e){
  return {
    gameId: e.gameId, name: e.name, nameZh: e.nameZh || null,
    rank: e.rank, thumbnail: e.thumbnail,
    meta: {weight: e.weight, minPlayers: e.minPlayers, maxPlayers: e.maxPlayers, playTime: e.playTime},
    theme: {accent: e.accent || derivedAccent(e.gameId)},
    hasScoring: e.hasScoring === true
  };
}

async function loadCatalog(){
  let idx = null;
  try{
    const res = await fetch(`${DATA_BASE}/games-index.json`);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(!Array.isArray(data) || !data.length) throw new Error("index 空咗");
    idx = data;
    await store.putCache("games-index", data);   // 落快取,下次離線用
    catalog.offline = false;
  }catch(err){
    idx = await store.getCache("games-index");   // 網唔通 → 讀返上次下載嘅
    catalog.offline = Array.isArray(idx) && idx.length > 0;
  }
  if(!Array.isArray(idx) || !idx.length){
    catalog.list = []; catalog.noData = true; return;   // 首次使用 + 冇網
  }
  catalog.noData = false;
  catalog.list = idx.map(indexEntry);
  catalog.list.sort((a, b) => (a.rank ?? Infinity) - (b.rank ?? Infinity));
}

/* 未有專屬計分表:即場砌一張通用表(得一個「總分」欄)
   reason: "none" = 呢隻遊戲未有專屬表;"offline" = 有,但離線又未快取過 */
function genericGame(entry, reason){
  return {
    schemaVersion: 1,
    gameId: entry.gameId, name: entry.name, nameZh: entry.nameZh,
    generic: reason || "none",
    theme: entry.theme,
    meta: entry.meta, rank: entry.rank,
    scoring: {
      source: "generic", verified: false, tieBreaker: "—",
      fields: [
        {id:"total", label:"總分", note:"未有專屬計分表,直接入最終總分",
         icon:"🧮", color:"#E5E0D5", input:"number", min:-9999}
      ],
      total: {type:"sum"}
    }
  };
}

/* 貼返 index 嗰邊嘅 meta / rank / theme,無論張表由邊度嚟 */
function decorateGame(doc, entry, gameId){
  return {
    ...doc,
    meta: entry ? entry.meta : (doc.meta || {minPlayers: 1, maxPlayers: 7}),
    rank: entry ? entry.rank : doc.rank,
    theme: doc.theme || (entry && entry.theme) || {accent: derivedAccent(gameId)}
  };
}

/* 揀遊戲嗰刻先攞計分表:
   用戶自訂 → 記憶體 → 網絡(順手落快取)→ 快取 → 通用表 */
async function loadGame(gameId){
  const entry = catalog.list.find(g => g.gameId === gameId);
  if(catalog.userIds.has(gameId)){                     // 用戶版蓋過原版
    const ut = await store.getUserTemplate(gameId);
    if(ut?.scoring?.fields?.length){
      const g = decorateGame(ut, entry, gameId);
      catalog.cache.set(gameId, g);
      return g;
    }
    catalog.userIds.delete(gameId);                    // 讀唔返(壞咗)→ 當冇
  }
  if(catalog.cache.has(gameId)) return catalog.cache.get(gameId);
  if(entry && !entry.hasScoring){                      // 冇專屬表 → 通用表
    const g = genericGame(entry, "none");
    catalog.cache.set(gameId, g);
    return g;
  }
  let doc = null;
  try{
    const res = await fetch(`${DATA_BASE}/scoring/${gameId}.json`);
    if(!res.ok) throw new Error("HTTP " + res.status);
    doc = await res.json();
    if(!doc?.scoring?.fields?.length) throw new Error("計分表格式唔啱");
    await store.putCache("scoring:" + gameId, doc);    // 落快取
  }catch(err){
    doc = await store.getCache("scoring:" + gameId);   // 離線 → 讀返快取
    if(!doc?.scoring?.fields?.length){
      if(entry) return genericGame(entry, "offline");  // 快取都冇:起碼開得通用表
      throw err;
    }
  }
  const game = decorateGame(doc, entry, gameId);
  if(entry){ entry.theme = game.theme; entry.nameZh = doc.nameZh || entry.nameZh; }
  catalog.cache.set(gameId, game);
  return game;
}

/* ---------- storage(IndexedDB → 記憶體 fallback) ---------- */
const store = (() => {
  let db=null, mem={plays:[], lastPlayers:[]}, memCache=new Map(), memUT=new Map(), usingMem=false;
  function open(){
    return new Promise(res=>{
      try{
        const rq=indexedDB.open("bgtool",3);
        rq.onupgradeneeded=e=>{
          const d=e.target.result;
          if(!d.objectStoreNames.contains("plays")) d.createObjectStore("plays",{keyPath:"id"});
          if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv",{keyPath:"k"});
          if(!d.objectStoreNames.contains("cache")) d.createObjectStore("cache",{keyPath:"k"});
          if(!d.objectStoreNames.contains("userTemplates")) d.createObjectStore("userTemplates",{keyPath:"gameId"});
        };
        rq.onsuccess=e=>{db=e.target.result; res();};
        rq.onerror=()=>{usingMem=true; res();};
      }catch(e){usingMem=true; res();}
    });
  }
  async function allPlays(){
    if(usingMem||!db) return [...mem.plays];
    return new Promise(res=>{
      try{
        const t=db.transaction("plays").objectStore("plays").getAll();
        t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([...mem.plays]);
      }catch(e){res([...mem.plays]);}
    });
  }
  async function putPlay(p){
    mem.plays=mem.plays.filter(x=>x.id!==p.id); mem.plays.push(p);
    if(usingMem||!db) return;
    try{db.transaction("plays","readwrite").objectStore("plays").put(p);}catch(e){}
  }
  async function delPlay(id){
    mem.plays=mem.plays.filter(x=>x.id!==id);
    if(usingMem||!db) return;
    try{db.transaction("plays","readwrite").objectStore("plays").delete(id);}catch(e){}
  }
  async function getKV(k,fb){
    if(usingMem||!db) return mem[k]??fb;
    return new Promise(res=>{
      try{
        const t=db.transaction("kv").objectStore("kv").get(k);
        t.onsuccess=()=>res(t.result?t.result.v:fb); t.onerror=()=>res(fb);
      }catch(e){res(fb);}
    });
  }
  async function setKV(k,v){
    mem[k]=v;
    if(usingMem||!db) return;
    try{db.transaction("kv","readwrite").objectStore("kv").put({k,v});}catch(e){}
  }
  /* 離線快取:games-index / scoring:{gameId} 嘅 JSON 原文 */
  async function putCache(k,v){
    memCache.set(k,v);
    if(usingMem||!db) return;
    try{db.transaction("cache","readwrite").objectStore("cache").put({k,v,at:Date.now()});}catch(e){}
  }
  async function getCache(k){
    if(usingMem||!db) return memCache.get(k)??null;
    return new Promise(res=>{
      try{
        const t=db.transaction("cache").objectStore("cache").get(k);
        t.onsuccess=()=>res(t.result?t.result.v:(memCache.get(k)??null));
        t.onerror=()=>res(memCache.get(k)??null);
      }catch(e){res(memCache.get(k)??null);}
    });
  }
  /* 用戶自訂計分表:key = gameId,內容係完整 scoring 檔格式 */
  async function getUserTemplate(gameId){
    if(usingMem||!db) return memUT.get(gameId)??null;
    return new Promise(res=>{
      try{
        const t=db.transaction("userTemplates").objectStore("userTemplates").get(gameId);
        t.onsuccess=()=>res(t.result??memUT.get(gameId)??null);
        t.onerror=()=>res(memUT.get(gameId)??null);
      }catch(e){res(memUT.get(gameId)??null);}
    });
  }
  async function putUserTemplate(doc){
    memUT.set(doc.gameId,doc);
    if(usingMem||!db) return;
    try{db.transaction("userTemplates","readwrite").objectStore("userTemplates").put(doc);}catch(e){}
  }
  async function delUserTemplate(gameId){
    memUT.delete(gameId);
    if(usingMem||!db) return;
    try{db.transaction("userTemplates","readwrite").objectStore("userTemplates").delete(gameId);}catch(e){}
  }
  async function allUserTemplates(){
    if(usingMem||!db) return [...memUT.values()];
    return new Promise(res=>{
      try{
        const t=db.transaction("userTemplates").objectStore("userTemplates").getAll();
        t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([...memUT.values()]);
      }catch(e){res([...memUT.values()]);}
    });
  }
  return {open,allPlays,putPlay,delPlay,getKV,setKV,putCache,getCache,
          getUserTemplate,putUserTemplate,delUserTemplate,allUserTemplates, isMem:()=>usingMem};
})();

  editing:null,      // {pIdx, field}

  historyFilter:null,// 只顯示某 gameId 嘅紀錄
  historyQuery:"",   // 紀錄搜尋字串
  historyCache:[],
  draft:null,        // 編輯緊嘅 template 草稿
  draftErrors:null,  // {top:[], perField:{i:[msg]}}
  draftBase:null     // {isUserEdited, baseSource}
};

const $=s=>document.querySelector(s);
const main=$("#main"), bar=$("#bar"), barTitle=$("#barTitle"),
      backBtn=$("#backBtn"), saveBtn=$("#saveBtn"), editBtn=$("#editBtn"), pad=$("#pad");

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function setAccent(hex){
  document.documentElement.style.setProperty("--accent",hex);
  document.documentElement.style.setProperty("--accent-soft",hex+"22");
}

/* ---------- scoring maths ---------- */
function fieldScore(f,raw){
  if(raw===undefined||raw===null||raw==="") return null;
  let v=0;
  if(f.input==="number") v=Number(raw)||0;
  else if(f.input==="counter") v=(Number(raw)||0)*(f.unitValue??1);
  else if(f.input==="bonus") v=raw?f.value:0;
  else if(f.input==="tiered"){
    const row=(f.table||[]).find(r=>r[0]===Number(raw));
    v=row?row[1]:0;
  }
  return v*(f.sign??1);
}
function totalFor(pIdx){
  const ps=S.scores[pIdx]||{};
  let sum=0, any=false;
  for(const f of S.game.scoring.fields){
    const v=fieldScore(f,ps[f.id]);
    if(v!==null){sum+=v; any=true;}
  }
  return any?sum:null;
}

/* ---------- render root ---------- */
function render(){
  /* 離開清單就收返 observer,唔好留住已 detach 嘅 sentinel */
  if(S.view!=="games" && listIO){ listIO.disconnect(); listIO=null; listAppend=null; }
  backBtn.style.visibility = (S.view==="setup"||S.view==="sheet"||S.view==="editor") ? "visible":"hidden";
  backBtn.textContent = S.view==="editor" ? "取消" : "‹ 返回";
  saveBtn.style.visibility = (S.view==="sheet"||S.view==="editor") ? "visible":"hidden";
  editBtn.style.visibility = S.view==="sheet" ? "visible":"hidden";
  document.getElementById("tabs").style.display = (S.view==="games"||S.view==="history")?"flex":"none";
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===S.view);
  });
  if(S.view==="games") renderGames();
  else if(S.view==="setup") renderSetup();
  else if(S.view==="sheet") renderSheet();
  else if(S.view==="history") renderHistory();
  else if(S.view==="editor") renderEditor();
}

/* ---------- view: game list ----------
   3000 隻唔可以一次過 render。實測(CPU 20x ≈ 低階 Android):
   一次過出 3000 張 = 21,011 個 DOM 節點、6,012 個 event listener、
   主線程鎖死 1,544ms —— 就係開 app 閃退嘅源頭。
   而家:首屏 50 張,IntersectionObserver sentinel 見底再補 50。
   搜尋照行全量 catalog.list,但結果一樣分批出。 */
const LIST_PAGE = 50;
let listIO=null, listAppend=null, scrollFallbackBound=false;

function gcardHTML(g){
  const rank=(g.rank!=null && isFinite(g.rank)) ? g.rank : "·";
  return `<button class="gcard" data-id="${esc(g.gameId)}">
    <span class="rank">${rank}</span>
    <span class="dot" style="background:${esc(safeAccent(g.theme.accent, g.gameId))}"></span>
    <span class="gname">${esc(g.nameZh||g.name)}
      ${g.nameZh&&g.nameZh!==g.name?`<small>${esc(g.name)}</small>`:""}
    </span>
    ${catalog.userIds.has(g.gameId)?`<span class="chip">✏️ 自訂</span>`
      :(g.hasScoring?"":`<span class="chip">通用表</span>`)}
    ${g.meta.weight?`<span class="chip">⚖️ ${g.meta.weight}</span>`:""}
    ${g.meta.minPlayers?`<span class="chip">👥 ${g.meta.minPlayers}–${g.meta.maxPlayers}</span>`:""}
  </button>`;
}

function renderGames(){
  setAccent("#3E7C4F"); barTitle.textContent="桌遊計分";
  if(listIO){ listIO.disconnect(); listIO=null; listAppend=null; }
  if(catalog.noData){          // 網同快取都冇
    main.innerHTML=`<div class="empty-state"><div class="big">📡</div>
      首次使用需要網絡下載遊戲資料。<br>連咗網再開一次就得,之後離線都用到。</div>`;
    return;
  }
  const withScoring=catalog.list.filter(g=>g.hasScoring).length;
  main.innerHTML=`
    <input class="search" id="q" type="search" placeholder="搜尋遊戲⋯" autocomplete="off">
    ${catalog.offline?`<p class="offline-note">離線模式:用緊上次下載嘅資料(共 ${catalog.list.length} 隻)。</p>`:""}
    <div id="glist"></div>
    <div id="gsentinel" aria-hidden="true"></div>
    <p class="listcount" id="gcount"></p>
    <p class="sheetnote">共 ${catalog.list.length} 隻 · ${withScoring} 隻有專屬計分表,其餘開通用計分表</p>
  `;
  const list=$("#glist"), sentinel=$("#gsentinel"), counter=$("#gcount");
  let hits=[], shown=0;

  function appendBatch(){
    if(shown>=hits.length) return;
    const next=hits.slice(shown, shown+LIST_PAGE);
    list.insertAdjacentHTML("beforeend", next.map(gcardHTML).join(""));
    shown+=next.length;
    counter.textContent = shown<hits.length
      ? `顯示緊 ${shown} / ${hits.length} 隻 · 向下捲會自動載入`
      : (hits.length>LIST_PAGE ? `全部 ${hits.length} 隻已顯示` : "");
    if(!listIO) return;
    if(shown>=hits.length) listIO.unobserve(sentinel);
    else { listIO.unobserve(sentinel); listIO.observe(sentinel); }  // 一屏裝唔滿就再補一批
  }
  listAppend=appendBatch;

  function draw(q){
    const raw=(q||"").trim(), ql=raw.toLowerCase();
    hits=catalog.list.filter(g=>!raw                 // 搜尋照行全量數據
      || g.name.toLowerCase().includes(ql)
      || (g.nameZh||"").includes(raw));
    shown=0; list.innerHTML="";
    if(!hits.length){
      list.innerHTML=`<div class="empty-state">搵唔到「${esc(raw)}」。</div>`;
      counter.textContent="";
      if(listIO) listIO.unobserve(sentinel);
      return;
    }
    if(listIO) listIO.observe(sentinel);
    appendBatch();                                   // 首屏一批
  }

  /* 事件委派:一個 listener 睇晒成個清單。
     原本係逐張卡綁 onclick(3000 個 closure),而家永遠得 1 個。 */
  list.onclick=async e=>{
    const b=e.target.closest(".gcard");
    if(!b || b.disabled) return;
    b.disabled=true;
    try{
      S.game=await loadGame(b.dataset.id);
      S.editPlayId=null;
      S.view="setup"; render();
    }catch(err){
      b.disabled=false;
      toast("載入計分表失敗:"+b.dataset.id);
    }
  };

  if(typeof IntersectionObserver==="function"){
    listIO=new IntersectionObserver(entries=>{
      if(entries.some(x=>x.isIntersecting)) appendBatch();
    }, {root:null, rootMargin:"400px 0px"});
  }else{                                             // 極舊 WebView:退返捲動偵測
    if(!scrollFallbackBound){
      scrollFallbackBound=true;
      window.addEventListener("scroll",()=>{
        if(S.view!=="games" || !listAppend) return;
        if(window.innerHeight+window.scrollY >= document.documentElement.scrollHeight-400) listAppend();
      }, {passive:true});
    }
    listIO={observe(){},unobserve(){},disconnect(){}};
  }

  draw("");
  let timer=null;                                    // 入字 debounce
  $("#q").oninput=e=>{
    const v=e.target.value;
    clearTimeout(timer);
    timer=setTimeout(()=>draw(v),120);
  };
}

    S.players = S.players.slice(0, g.meta.maxPlayers||7);

  `;

      || `<span class="chip">未有玩家</span>`;

      S.players.splice(Number(b.dataset.i),1); draw();

    S.players.push(v); $("#pname").value=""; draw(); $("#pname").focus();

  $("#startBtn").onclick=async()=>{
    await store.setKV("lastPlayers",S.players);
    S.scores={}; S.players.forEach((_,i)=>S.scores[i]={});
    S.view="sheet"; render();
  };

}

/* ---------- 信度提示條 ----------
   一行細字,唔彈窗唔阻擋操作。只講張表打邊嚟、可唔可信。 */
function srcInfo(g){
  const s=g.scoring||{};
  if(g.generic){
    return {cls:"warn", text: g.generic==="offline"
      ? "通用計分表(離線,未快取專屬表)" : "通用計分表(未有專屬)"};
  }
  if(s.source==="user-edited") return {cls:"custom", text:"✏️ 自訂版本", revert:true};
  if(s.verified===true) return {cls:"ok", text:"✓ 已核對"};
  switch(s.source){
    case "manual":
      return {cls:"", text:"人手編寫"};
    case "rulebook-web":
      return {cls:"", text:"按官方規則書生成",
              link: /^https?:\/\//.test(s.sourceUrl||"") ? s.sourceUrl : null};
    case "claude-code-gen":
      return {cls:"", text:"AI 生成,未核對"};
    case "desc-gen":
      return {cls:"warn", text:"計分項按遊戲描述推斷,建議核對"};
    default:
      return {cls:"", text: s.source ? "來源:"+s.source : "來源不明"};
  }
}
function srcBarHTML(g){
  const i=srcInfo(g);
  return `<div class="srcbar ${i.cls}">
    <span>${esc(i.text)}</span>
    ${i.link?`<a href="${esc(i.link)}" target="_blank" rel="noopener">規則書 ↗</a>`:""}
    ${i.revert?`<button class="lnk" id="srcRevert">還原預設</button>`:""}
  </div>`;
}
/* 撳一下變「確認?」,撳第二下先做 —— 唔使 confirm() 彈窗 */
function bindRevert(){
  const b=$("#srcRevert"); if(!b) return;
  b.onclick=async()=>{
    if(b.dataset.armed!=="1"){
      b.dataset.armed="1"; b.textContent="確認還原?";
      setTimeout(()=>{ if(b.isConnected&&b.dataset.armed==="1"){b.dataset.armed="0"; b.textContent="還原預設";} },4000);
      return;
    }
    await revertTemplate(S.game.gameId);
  };
}
async function revertTemplate(gameId){
  await store.delUserTemplate(gameId);
  catalog.userIds.delete(gameId);
  catalog.cache.delete(gameId);
  S.game=await loadGame(gameId);
  S.view="sheet"; render();
  toast("已還原預設計分表");
}

/* ---------- view: score sheet ---------- */
function renderSheet(){
  const g=S.game; setAccent(g.theme.accent);
  barTitle.textContent=(g.nameZh||g.name)+(S.editPlayId?" · 編輯":"");
  const fields=g.scoring.fields;
  let html=srcBarHTML(g)+`<div class="sheetwrap"><table class="sheet">
    <thead><tr><th>${esc(g.name)}</th>${S.players.map(p=>`<th>${esc(p)}</th>`).join("")}</tr></thead><tbody>`;
  for(const f of fields){
    html+=`<tr><td><div class="frow-label">
      <span class="fic" style="background:${f.color||"var(--paper-deep)"}">${f.icon||"•"}</span>
      <span>${esc(f.label)}${f.note?`<small>${esc(f.note)}</small>`:""}</span>
    </div></td>`;
    S.players.forEach((_,pi)=>{
      html+=`<td class="cell" tabindex="0" data-p="${pi}" data-f="${f.id}">${cellHTML(f,pi)}</td>`;
    });
    html+=`</tr>`;
  }
  html+=`<tr class="trow"><td>Σ 總分</td>${S.players.map((_,pi)=>{
    const t=totalFor(pi);
    return `<td class="cell" data-total="${pi}"><span class="val score-hand">${t===null?"—":t}</span></td>`;
  }).join("")}</tr>`;
  html+=`</tbody></table></div>
    <p class="sheetnote">${g.scoring.tieBreaker && g.scoring.tieBreaker!=="—" ? "同分:"+esc(g.scoring.tieBreaker) : ""}
    ${store.isMem() ? "<br>⚠️ 預覽環境唔會保留數據;部署後先有永久儲存。":""}</p>
    <div class="sheetacts">
      <button class="btn ghost" id="editTplBtn">${g.generic?"＋ 為呢隻遊戲建立計分表":"✏️ 修改計分表"}</button>
    </div>`;
  main.innerHTML=html;
  bindCells();
  bindRevert();
  $("#editTplBtn").onclick=openEditor;
}
function cellHTML(f,pi){
  const raw=S.scores[pi]?.[f.id];
  if(f.input==="counter"){
    const c=Number(raw)||0;
    return `<div class="cnt">
      <button data-step="-1" aria-label="減">−</button>
      <span class="val score-hand">${raw===undefined?'<span class="val empty">·</span>':c}</span>
      <button data-step="1" aria-label="加">＋</button></div>`;
  }
  if(f.input==="bonus"){
    return raw ? `<span class="val score-hand">${f.value*(f.sign??1)>0?"+":""}${f.value*(f.sign??1)}</span>`
               : `<span class="val empty">拍一下</span>`;
  }
  if(f.input==="tiered"){
    if(raw===undefined) return `<span class="val empty">揀格數</span>`;
    return `<span class="val score-hand">${fieldScore(f,raw)}</span>`;
  }
  // number
  if(raw===undefined||raw==="") return `<span class="val empty">—</span>`;
  const v=Number(raw)*(1); // raw entered as-is; sign applied in total
  return `<span class="val score-hand">${(f.sign??1)<0&&v>0?"−":""}${v}</span>`;
}
function refreshCell(pi,f){
  const td=main.querySelector(`td[data-p="${pi}"][data-f="${f.id}"]`);
  if(td){td.innerHTML=cellHTML(f,pi); bindCell(td);}
  const tt=main.querySelector(`td[data-total="${pi}"] .val`);
  if(tt){const t=totalFor(pi); tt.textContent=t===null?"—":t;}
}
function bindCells(){ main.querySelectorAll("td.cell[data-f]").forEach(bindCell); }
function bindCell(td){
  const pi=Number(td.dataset.p), f=S.game.scoring.fields.find(x=>x.id===td.dataset.f);
  if(f.input==="counter"){
    td.querySelectorAll("button[data-step]").forEach(b=>{
      b.onclick=e=>{
        e.stopPropagation();
        const cur=Number(S.scores[pi][f.id])||0;
        const next=Math.max(0, cur+Number(b.dataset.step));
        S.scores[pi][f.id]=next; refreshCell(pi,f);
      };
    });
    return;
  }
  const act=()=>{
    if(f.input==="bonus"){
      S.scores[pi][f.id] = S.scores[pi][f.id] ? undefined : 1;
      refreshCell(pi,f); return;
    }
    if(f.input==="tiered"){ openTierPad(pi,f); return; }
    openNumPad(pi,f);
  };
  td.onclick=act;
  td.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}};
}

/* ---------- keypad ---------- */
function openNumPad(pi,f){
  S.editing={pi,f};
  let buf = S.scores[pi][f.id]!==undefined ? String(S.scores[pi][f.id]) : "";
  const allowNeg = (f.min??0) < 0;
  function draw(){
    pad.innerHTML=`
      <div class="padhead">
        <span class="fic" style="background:${f.color||"var(--paper-deep)"};width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center">${f.icon||"•"}</span>
        <span class="who">${esc(S.players[pi])} · ${esc(f.label)}</span>
        <span class="padval score-hand">${buf===""?"—":buf}</span>
      </div>
      <div class="keys">
        ${[7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="act" data-k="del">⌫</button>
        ${[4,5,6].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="act" data-k="clr">清除</button>
        ${[1,2,3].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button class="act" data-k="neg" ${allowNeg?"":"disabled"}>±</button>
        <button data-k="0" style="grid-column:span 2">0</button><button data-k="00">00</button><button class="act" data-k="ok">✓ 好</button>
      </div>`;
    pad.querySelectorAll("button").forEach(b=>b.onclick=()=>key(b.dataset.k));
  }
  function key(k){
    if(k==="del") buf=buf.slice(0,-1);
    else if(k==="clr") buf="";
    else if(k==="neg") buf = buf.startsWith("-") ? buf.slice(1) : (buf?"-"+buf:"-");
    else if(k==="ok"){
      if(buf===""||buf==="-") S.scores[pi][f.id]=undefined;
      else S.scores[pi][f.id]=Number(buf);
      closePad(); refreshCell(pi,f); nextCell(pi,f); return;
    }
    else if(buf.replace("-","").length<4) buf+=k;
    draw();
  }
  draw(); pad.classList.add("open");
}
function openTierPad(pi,f){
  S.editing={pi,f};
  pad.innerHTML=`
    <div class="padhead"><span class="who">${esc(S.players[pi])} · ${esc(f.label)}</span>
      <button class="btn ghost" id="tierClose" style="padding:8px 14px">收起</button></div>
    <div class="tierlist">
      ${(f.table||[]).map(r=>`<button data-n="${r[0]}"><span>${r[0]} 格</span><b class="score-hand">${r[1]*(f.sign??1)} 分</b></button>`).join("")}
    </div>`;
  pad.querySelectorAll(".tierlist button").forEach(b=>b.onclick=()=>{
    S.scores[pi][f.id]=Number(b.dataset.n);
    closePad(); refreshCell(pi,f); nextCell(pi,f);
  });
  $("#tierClose").onclick=closePad;
  pad.classList.add("open");
}
function closePad(){pad.classList.remove("open"); S.editing=null;}
document.addEventListener("click",e=>{

/* 入完自動跳下一個玩家同一行 */
function nextCell(pi,f){
  if(pi+1 < S.players.length){
    const td=main.querySelector(`td[data-p="${pi+1}"][data-f="${f.id}"]`);
    if(td && (f.input==="number")) openNumPad(pi+1,f);

/* =========================================================
   自訂計分表編輯器
   draft 係 scoring 檔格式嘅副本,加咗兩個 UI-only 欄位:
     _tableText (tiered 嘅 textarea 原文)、allowNeg (number 可唔可以入負數)
   儲存前經 fromDraftField() 轉返正式格式,再行 validateDoc()。
========================================================= */
const INPUT_TYPES=[["number","數字入分"],["counter","數量 × 單價"],["bonus","有/冇 加分"],["tiered","階梯查表"]];

function toDraftField(f){
  return {
    ...f,
    sign: f.sign===-1 ? -1 : 1,
    allowNeg: Number(f.min??0) < 0,
    _tableText: (f.table||[]).map(r=>Array.isArray(r)?r.join(","):"").join("\n")
  };
}
/* 「每行一對:數量,得分」→ [[n,pts],…];行有問題就放 null 等 validate 標紅 */
function parseTierText(text){
  const rows=[];
  for(const line of String(text||"").split("\n")){
    const t=line.trim(); if(!t) continue;
    const parts=t.split(/[,，、\s]+/).filter(Boolean);
    if(parts.length!==2){ rows.push(null); continue; }
    const a=Number(parts[0]), b=Number(parts[1]);
    rows.push(Number.isFinite(a)&&Number.isFinite(b) ? [a,b] : null);
  }
  return rows;
}
function fromDraftField(f){
  const out={...f};
  delete out._tableText; delete out.allowNeg;
  out.id=String(f.id||"").trim();
  out.label=String(f.label||"").trim();
  out.icon=String(f.icon||"").trim() || "•";
  out.color=HEXRE.test(f.color||"") ? f.color : "#E5E0D5";
  const note=String(f.note||"").trim();
  if(note) out.note=note; else delete out.note;
  if(Number(f.sign)===-1) out.sign=-1; else delete out.sign;
  delete out.unitValue; delete out.value; delete out.table; delete out.min;
  if(f.input==="number")  out.min = f.allowNeg ? -9999 : 0;
  if(f.input==="counter") out.unitValue = f.unitValue==="" || f.unitValue==null ? NaN : Number(f.unitValue);
  if(f.input==="bonus")   out.value     = f.value==="" || f.value==null ? NaN : Number(f.value);
  if(f.input==="tiered")  out.table     = parseTierText(f._tableText);
  return out;
}

/* lib/validate.mjs 嗰套規則嘅 JS 版(錯誤分返去每一行 field) */
function validateDoc(doc){
  const top=[], perField={};
  const push=(i,m)=>{ (perField[i]=perField[i]||[]).push(m); };
  if(doc.schemaVersion!==1) top.push("schemaVersion 要係 1");
  if(!(typeof doc.gameId==="string" && /^(bgg-\d+|custom-.+)$/.test(doc.gameId))) top.push("gameId 格式錯");
  if(!(typeof doc.name==="string" && doc.name)) top.push("遊戲名唔可以空");
  if(!(doc.theme && HEXRE.test(doc.theme.accent||""))) top.push("theme.accent 要係 #RRGGBB");
  const s=doc.scoring;
  if(!s || !Array.isArray(s.fields)){ top.push("scoring 缺失"); return {top,perField}; }
  if(s.fields.length<1 || s.fields.length>20) top.push("計分項目要 1–20 個");
  const ids=new Set();
  s.fields.forEach((f,i)=>{
    if(!(typeof f.id==="string" && /^[a-z0-9_]+$/.test(f.id))) push(i,"id 要係細楷英文、數字或底線");
    else if(ids.has(f.id)) push(i,`id 重複:${f.id}`);
    if(typeof f.id==="string") ids.add(f.id);
    if(!f.label) push(i,"要有項目名稱");
    if(!INPUT_TYPES.some(([v])=>v===f.input)) push(i,"輸入類型唔啱");
    if(f.color!=null && !HEXRE.test(f.color)) push(i,"color 要係 #RRGGBB");
    if(f.sign!=null && f.sign!==1 && f.sign!==-1) push(i,"sign 要係 1 或 -1");
    if(f.input==="counter" && !Number.isFinite(f.unitValue)) push(i,"「數量 × 單價」要填每個幾多分");
    if(f.input==="bonus" && !Number.isFinite(f.value)) push(i,"「有/冇 加分」要填分數");
    if(f.input==="tiered"){
      if(!Array.isArray(f.table) || f.table.length<2) push(i,"階梯表至少要兩行");
      else if(!f.table.every(r=>Array.isArray(r)&&r.length===2&&Number.isFinite(r[0])&&Number.isFinite(r[1])))
        push(i,"階梯表每行要寫成「數量,得分」");
    }
  });
  if(s.total!=null && !["sum","expression"].includes(s.total.type)) top.push("total.type 要係 sum/expression");
  return {top,perField};
}

  S.draftBase={
    isUserEdited: s.source==="user-edited",
    baseSource: s.baseSource || (g.generic ? "generic" : (s.source||"unknown"))
  };
  S.draft={
    schemaVersion:1,
    gameId:g.gameId,
    name:g.name,
    nameZh:g.nameZh||null,
    theme:{accent:safeAccent(g.theme&&g.theme.accent, g.gameId)},
    scoring:{
      tieBreaker: s.tieBreaker && s.tieBreaker!=="—" ? s.tieBreaker : "",
      sourceUrl: s.sourceUrl || null,
      total: s.total && s.total.type ? s.total : {type:"sum"},
      fields: (s.fields||[]).map(toDraftField)
    }
  };
  S.draftErrors=null;
  S.view="editor"; render();
}

function buildDocFromDraft(){
  const d=S.draft, s=d.scoring;
  const out={
    schemaVersion:1,
    gameId:d.gameId,
    name:d.name,
    theme:{accent:d.theme.accent},
    scoring:{
      source:"user-edited",
      baseSource:S.draftBase.baseSource,
      verified:true,
      editedAt:new Date().toISOString(),
      tieBreaker:String(s.tieBreaker||"").trim() || "—",
      fields:s.fields.map(fromDraftField),
      total:s.total
    }
  };
  if(d.nameZh) out.nameZh=d.nameZh;
  if(s.sourceUrl) out.scoring.sourceUrl=s.sourceUrl;
  return out;
}

function drawFields(){
  const fs=S.draft.scoring.fields;
  const errs=(S.draftErrors&&S.draftErrors.perField)||{};
  $("#ed-count").textContent=`${fs.length} 項 · 最多 20 項`;
  const host=$("#edfields");
  host.innerHTML=fs.map((f,i)=>fieldCardHTML(f,i,fs.length,errs)).join("");
  /* 結構有改動(加/刪/上下移/轉類型)先重畫;打字唔重畫,唔會走 focus */
  const restructure=fn=>{ fn(); S.draftErrors=null; drawFields(); };
  host.querySelectorAll(".edcard").forEach(card=>{
    const i=Number(card.dataset.i), f=fs[i];
    card.querySelectorAll("[data-k]").forEach(el=>{
      const k=el.dataset.k;
      if(el.type==="checkbox"){ el.onchange=()=>{ f[k]=el.checked; }; return; }
      if(k==="input"){ el.onchange=()=>restructure(()=>{ f.input=el.value; }); return; }
      if(k==="sign"){ el.onchange=()=>{ f.sign=Number(el.value)===-1?-1:1; }; return; }
      el.oninput=()=>{ f[k]=el.value; };
    });
    card.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
      const j=i+Number(b.dataset.mv);
      if(j<0||j>=fs.length) return;
      restructure(()=>{ const tmp=fs[i]; fs[i]=fs[j]; fs[j]=tmp; });
    });
    card.querySelector("[data-del]").onclick=()=>{
      if(fs.length<=1){ toast("至少要留一項"); return; }
      restructure(()=>fs.splice(i,1));
    };
  });
}

function addField(){
  const fs=S.draft.scoring.fields;
  if(fs.length>=20){ toast("最多 20 項"); return; }
  let n=fs.length+1, id="f"+n;
  while(fs.some(f=>f.id===id)){ n++; id="f"+n; }
  fs.push({id, label:"", note:"", icon:"⭐", color:"#E5E0D5",
           input:"number", sign:1, allowNeg:false, _tableText:""});
  S.draftErrors=null; drawFields();
  const last=main.querySelector(`.edcard[data-i="${fs.length-1}"]`);
  if(last){ last.scrollIntoView({block:"center",behavior:"smooth"}); last.querySelector('[data-k="label"]').focus(); }
}

async function saveTemplate(){
  const doc=buildDocFromDraft();

  if(v.top.length || Object.keys(v.perField).length){

    const bad=main.querySelector(".edcard.bad")||main.querySelector(".ederr-top");
    if(bad) bad.scrollIntoView({block:"center",behavior:"smooth"});
    toast("有嘢未填妥,睇下紅色嗰啲");
    return;

  await store.putUserTemplate(doc);
  catalog.userIds.add(doc.gameId);
  catalog.cache.delete(doc.gameId);
  S.game=await loadGame(doc.gameId);
  S.draft=null; S.draftErrors=null;
  S.view="sheet"; render();

}

async function savePlay(){
  const g=S.game;

  if(totals.every(t=>t===null)){toast("未入過分數"); return;}
  const max=Math.max(...totals.map(t=>t??-Infinity));
  const editing = S.editPlayId ? S.historyCache.find(p=>p.id===S.editPlayId) : null;
  const play={
    id: editing ? editing.id : "p"+Date.now(),
    gameId:g.gameId, gameName:g.nameZh||g.name, accent:g.theme.accent,
    date: editing ? editing.date : new Date().toISOString(),
    editedAt: editing ? new Date().toISOString() : undefined,
    players:S.players.map((p,i)=>({name:p,total:totals[i],win:totals[i]===max,detail:{...S.scores[i]}}))
  };
  await store.putPlay(play);
  toast(editing ? "已更新 ✓" : "已儲存 ✓");
  S.players=[]; S.scores={}; S.game=null; S.editPlayId=null;
  S.view="history"; render();
}

      </div>
      <div class="rowbtns">
        <button data-edit="${p.id}">✏️ 編輯</button>
        <button data-del="${p.id}">刪除</button>
      </div>
    </div>`;
  }).join("") : `<div class="empty-state"><div class="big">📜</div>
      ${all.length? "呢個條件下冇紀錄。":"未有紀錄。<br>計完第一場就會喺度出現。"}</div>`;
  $("#hq").oninput=e=>{
    S.historyQuery=e.target.value;
    renderHistory(); // 重畫但保留輸入值
    requestAnimationFrame(()=>{const i=$("#hq"); if(i){i.focus(); i.setSelectionRange(i.value.length,i.value.length);}});
  };
  const cf=$("#clearFilter");
  if(cf) cf.onclick=()=>{S.historyFilter=null; renderHistory();};
  main.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    await store.delPlay(b.dataset.del); renderHistory();
  });
  main.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editPlay(b.dataset.edit));
  bindIO();
}
async function editPlay(id){
  const p=S.historyCache.find(x=>x.id===id);
  if(!p) return;
  let g=null;
  try{ g=await loadGame(p.gameId); }catch(err){ g=null; }
  if(!g){toast("呢隻遊戲唔喺目前遊戲庫,暫時改唔到"); return;}
  S.game=g;
  S.players=p.players.map(x=>x.name);
  S.scores={};
  p.players.forEach((x,i)=>S.scores[i]={...(x.detail||{})});
  S.editPlayId=id;
  S.view="sheet"; render();
}
function ioHTML(){
  return `<div class="iorow">
    <button class="btn ghost" id="exportBtn">⬇️ 匯出 JSON</button>
    <button class="btn ghost" id="importBtn">⬆️ 匯入 JSON</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>`;
}
function bindIO(){
  $("#exportBtn").onclick=async()=>{
    const data={
      app:"bg-scorer", schemaVersion:1, exportVersion:2,
      exportedAt:new Date().toISOString(),
      plays:await store.allPlays(),
      userTemplates:await store.allUserTemplates()
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="bg-scorer-backup.json"; a.click();
    URL.revokeObjectURL(a.href);
  };
  $("#importBtn").onclick=()=>$("#importFile").click();
  $("#importFile").onchange=async e=>{
    const file=e.target.files[0]; if(!file) return;
    try{
      const data=JSON.parse(await file.text());
      if(!Array.isArray(data.plays)) throw 0;
      for(const p of data.plays) await store.putPlay(p);
      /* exportVersion 2 先有 userTemplates;v1 舊檔冇,淨還原 plays */
      let nT=0;
      if(Array.isArray(data.userTemplates)){
        for(const t of data.userTemplates){
          if(!t || typeof t.gameId!=="string" || !t.scoring?.fields?.length) continue;
          await store.putUserTemplate(t);
          catalog.userIds.add(t.gameId);
          catalog.cache.delete(t.gameId);
          nT++;
        }
      }
      toast(`已匯入 ${data.plays.length} 場${nT?` · ${nT} 個自訂計分表`:""}`); renderHistory();
    }catch(err){toast("檔案格式唔啱");}
    e.target.value="";
  };
}

/* ---------- nav ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  if(b.dataset.tab==="history"){S.historyFilter=null; S.historyQuery="";}
  if(b.dataset.tab==="games"){S.editPlayId=null;}
  S.view=b.dataset.tab; render();
});
backBtn.onclick=()=>{
  closePad();
  if(S.view==="editor"){ cancelEditor(); return; }
  if(S.view==="sheet"){ S.view="setup"; }
  else if(S.view==="setup"){ S.view="games"; S.players=[]; }
  render();
};
saveBtn.onclick=()=>{ S.view==="editor" ? saveTemplate() : savePlay(); };
editBtn.onclick=()=>{ closePad(); openEditor(); };

/* ---------- boot ---------- */
(async () => {
  /* index.json 有成 1.1MB,慢網要等好耐。即刻畫個 loading,
     唔好留住個白屏俾人以為死咗機。 */
  main.innerHTML=`<div class="empty-state"><div class="big">🎲</div>載入緊遊戲資料⋯</div>`;
  try{
    await store.open();
    const uts=await store.allUserTemplates();
    catalog.userIds=new Set(uts.map(d=>d.gameId));
    await loadCatalog();
    render();
  }catch(err){
    if(window.__showBootError){
      window.__showBootError("開 app 出錯",
        (err && err.message ? err.message : String(err))
        + (err && err.stack ? "\n"+err.stack.split("\n").slice(0,4).join("\n") : ""));
    }
    main.innerHTML=`<div class="empty-state"><div class="big">⚠️</div>
      開唔到。錯誤詳情喺畫面最頂嗰條紅色橫額。</div>`;
  }
})();
</script>
</body>
</html>
